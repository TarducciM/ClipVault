<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipVault</title>
    <script src="/i18n.js"></script>
    <script src="/preview-render.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app">
      <div class="search-bar">
        <input id="search-input" type="text" data-i18n-placeholder="searchPlaceholder" autofocus />
        <button id="extended-toggle" type="button" class="icon-toggle-btn" data-i18n-title="extendedTooltipOn">🕒</button>
        <button id="favorites-toggle" type="button" class="icon-toggle-btn" data-i18n-title="favoritesTooltipOn">☆</button>
        <button id="snippets-toggle" type="button" class="icon-toggle-btn" data-i18n-title="snippetsTooltipOn">🗒</button>
      </div>

      <ul id="history-list" class="history-list"></ul>

      <p id="empty-state" class="empty-state">
        <span data-i18n="emptyHistoryTitle">Nessuna voce in cronologia.</span><br />
        <span data-i18n="emptyHistorySubtitle">Copia qualcosa per iniziare.</span>
      </p>

      <p id="status-line" class="status-line"></p>

      <div class="footer-bar">
        <button id="settings-btn" type="button" class="text-btn icon-btn" data-i18n-title="settingsTooltip">⚙</button>
        <button id="clear-history-btn" type="button" class="text-btn" data-i18n="clearHistory">Cancella cronologia</button>
      </div>
    </main>

    <div id="context-menu" class="context-menu"></div>

    <div id="onboarding" class="onboarding">
      <div class="onboarding-box">
        <h2 data-i18n="onboardingTitle">Benvenuto in ClipVault</h2>
        <ul>
          <li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd> <span data-i18n="onboardingHotkey"></span></li>
          <li data-i18n="onboardingClick"></li>
          <li data-i18n="onboardingDblClick"></li>
          <li data-i18n="onboardingRightClick"></li>
          <li data-i18n="onboardingPin"></li>
          <li data-i18n="onboardingFavorites"></li>
          <li data-i18n="onboardingSettings"></li>
        </ul>
        <button id="onboarding-dismiss" type="button" data-i18n="onboardingDismiss">Ho capito</button>
      </div>
    </div>

    <div id="preview-overlay" class="onboarding">
      <div class="onboarding-box preview-box">
        <div class="preview-header">
          <span id="preview-title"></span>
          <button id="preview-expand" type="button" class="text-btn icon-btn" data-i18n-title="previewExpand">⛶</button>
          <button id="preview-close" type="button" class="text-btn icon-btn" data-i18n-title="previewClose">×</button>
        </div>
        <div id="preview-content" class="preview-content"></div>
      </div>
    </div>
  </body>
</html>
