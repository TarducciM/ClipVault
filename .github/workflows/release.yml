name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ClipVault ${{ github.ref_name }}'
          # draft so nothing goes live until reviewed and published by hand
          releaseDraft: true
          prerelease: false
          # Keep this true: it's what makes tauri-bundler produce the updater-specific
          # .nsis.zip/.sig artifacts at all (confirmed 2026-09-09 - setting it false skips
          # building them, not just uploading a manifest for them). What's actually broken is
          # tauri-action's OWN latest.json assembly step on this repo (both nsis+msi targets
          # built together on Windows: it signs both bundles fine, then fails to find "the"
          # signature and silently skips latest.json, even though the .sig is genuinely on
          # disk) - that part is redone by hand a few steps below, from the same NSIS .sig.
          uploadUpdaterJson: true

      # The portable exe needs no setup; drop it anywhere and run it.
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          portable="ClipVault_${version}_x64-portable.exe"
          cp "src-tauri/target/release/clipvault.exe" "$portable"
          gh release upload "${{ github.ref_name }}" "$portable" --repo "${{ github.repository }}" --clobber

      # Manual latest.json for tauri-plugin-updater — see the comment on uploadUpdaterJson
      # above for why this isn't left to tauri-action. Turns out (found via the diagnostic
      # below, 2026-09-09) tauri-bundler signs the raw setup.exe directly for NSIS — no
      # .nsis.zip wrapper is produced (that assumption was wrong, maybe carried over from
      # MSI's zip-wrapped updater format). The signed .exe is already uploaded as a normal
      # release asset by the tauri-action step above, so this step only needs its .sig.
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          nsis_dir="src-tauri/target/release/bundle/nsis"
          exe_file="$nsis_dir/ClipVault_${version}_x64-setup.exe"
          sig_file="$exe_file.sig"

          if [ ! -f "$sig_file" ]; then
            echo "::error::NSIS updater signature missing ($sig_file)"
            echo "::group::Diagnostic - actual contents of $nsis_dir"
            ls -la "$nsis_dir" 2>&1 || echo "(directory itself does not exist)"
            echo "::endgroup::"
            exit 1
          fi

          signature=$(cat "$sig_file")
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > latest.json <<EOF
          {
            "version": "${version}",
            "pub_date": "${pub_date}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${signature}",
                "url": "${base}/ClipVault_${version}_x64-setup.exe"
              }
            }
          }
          EOF

          # Validate before uploading: a malformed manifest breaks the updater for every
          # already-installed version silently (no error shown to the user, it just never
          # finds an update) - catch that here instead, in CI, where it's visible.
          jq empty latest.json

          gh release upload "${{ github.ref_name }}" latest.json --repo "${{ github.repository }}" --clobber

  notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > notes.md

          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > downloads.md <<EOF
          ### Downloads

          | File | Notes |
          | --- | --- |
          | [ClipVault_${version}_x64-setup.exe]($base/ClipVault_${version}_x64-setup.exe) | Installer (NSIS) |
          | [ClipVault_${version}_x64_en-US.msi]($base/ClipVault_${version}_x64_en-US.msi) | Installer (MSI) |
          | [ClipVault_${version}_x64-portable.exe]($base/ClipVault_${version}_x64-portable.exe) | Portable, no install |

          **Recommended: use the installer** (setup.exe or .msi) — it adds a Start Menu shortcut, a clean entry in "Apps & features" for uninstalling, and a stable path for the "launch at Windows startup" setting. The portable .exe works fine for a quick try, but if you later move or delete it, autostart (if enabled) silently stops working, since it points at wherever the file was when you turned it on.

          **Consigliato: usa l'installer** (setup.exe o .msi) — aggiunge una voce nel menu Start, una disinstallazione pulita da "App e funzionalità" di Windows, e un percorso stabile per l'impostazione "avvia automaticamente con Windows". La versione portable va benissimo per una prova veloce, ma se in seguito la sposti o la elimini, l'avvio automatico (se attivato) smette di funzionare silenziosamente, perché punta a dove si trovava il file quando l'hai attivato.
          EOF

          cat downloads.md notes.md > full-notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file full-notes.md

  cleanup-on-failure:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The build failed, so the draft release (if tauri-action managed to create it
      # before the failure) only has partial assets. Remove it rather than leave a
      # broken half-release behind. Re-run the failed run (or workflow_dispatch) to
      # retry once fixed; the tag itself is untouched.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
